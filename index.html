<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Francis Bhandari's portfolio and UX design work.">
    <title>Francis Bhandari</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #faf9f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 0 1.5rem;
      }

      .site-header {
        display: flex;
        width: min(100%, 56rem);
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 0 auto;
        padding: 1.5rem 0;
        border-bottom: 1px solid #e8e6e1;
      }

      .site-name {
        color: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
      }

      nav a {
        color: #555;
        font-size: 0.9rem;
        text-decoration: none;
        text-underline-offset: 0.25em;
      }

      nav a:hover,
      nav a:focus-visible {
        color: #202124;
        text-decoration: underline;
      }

      main {
        width: min(100%, 38rem);
        margin: 0 auto;
      }

      #home {
        display: flex;
        min-height: 70vh;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #727272;
        font-size: 0.9rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.07em;
        line-height: 1;
      }

      .intro {
        max-width: 29rem;
        margin: 1.5rem 0 0;
        color: #555;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      @media (max-width: 600px) {
        body {
          padding: 0 1rem;
        }

        .site-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 1rem;
        }

        nav {
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="/">Francis Bhandari</a>

      <nav aria-label="Main navigation">
        <a href="/about/">About</a>
        <a href="/ux-design/">UX Design</a>
        <a href="/projects/">Projects</a>
        <a href="/contact/">Contact</a>
      </nav>
    </header>

    <main>
      <section id="home" aria-labelledby="home-title">
        <p class="eyebrow">Hello, I'm</p>
        <h1 id="home-title">Francis Bhandari.</h1>
        <p class="intro">
          Welcome to my little corner of the internet. I'm keeping things simple
          while I build and explore.
        </p>
      </section>
    </main>
  </body>
</html>
