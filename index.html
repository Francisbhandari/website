<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple, minimal personal website.">
  <title>Francis Bhandari</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #faf9f6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main { width: min(100%, 38rem); }

    p {
      margin: 0 0 1rem;
      color: #727272;
      font-size: 0.9rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .intro {
      max-width: 29rem;
      margin-top: 1.5rem;
      color: #555;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      color: inherit;
      text-underline-offset: 0.25em;
    }

    a:hover { color: #666; }
  </style>
</head>
<body>
  <main>
    <p>Hello, I'm</p>
    <h1>Francis Bhandari.</h1>
    <p class="intro">Welcome to my little corner of the internet. I'm keeping things simple while I build and explore.</p>
  </main>
</body>
</html>
