<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="About Francis Bhandari.">
    <title>About — Francis Bhandari</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #faf9f6;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 0 1.5rem;
      }

      .site-header {
        display: flex;
        width: calc(100% + 3rem);
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        margin: 0 -1.5rem;
        padding: 1.5rem;
        border-bottom: 1px solid #e8e6e1;
      }

      .site-name {
        color: inherit;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(1.5rem, 3vw, 2.5rem);
      }

      nav a {
        color: #444;
        font-size: 1rem;
        line-height: 1.5;
        text-decoration: none;
        text-underline-offset: 0.25em;
        transition: color 160ms ease;
      }

      nav a[aria-current="page"] {
        color: #202124;
        font-weight: 600;
      }

      nav a:hover,
      nav a:focus-visible {
        color: #202124;
        text-decoration: underline;
      }

      main {
        display: flex;
        width: min(100%, 38rem);
        min-height: 70vh;
        flex-direction: column;
        justify-content: center;
        margin: 0 auto;
      }

      .message {
        display: grid;
        grid-template-columns: min-content;
        justify-content: center;
        margin: 0;
        color: #555;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .message-start,
      .message-end { display: block; }
      .message-start { text-align: left; }
      .message-end { text-align: right; }

      .inspect {
        display: block;
        color: #202124;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.07em;
        line-height: 1;
        text-align: center;
      }

      @media (max-width: 600px) {
        body { padding: 0 1rem; }

        .site-header {
          width: calc(100% + 2rem);
          align-items: flex-start;
          flex-direction: column;
          gap: 1rem;
          margin: 0 -1rem;
          padding: 1.5rem 1rem;
        }

        nav { gap: 1.25rem; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="/">Francis Bhandari</a>
      <nav aria-label="Main navigation">
        <a href="/about/" aria-current="page">About</a>
        <a href="/ux-design/">UX Design</a>
        <a href="/projects/">Projects</a>
        <a href="/contact/">Contact</a>
      </nav>
    </header>

    <main>
      <p class="message">
        <span class="message-start">You should</span>
        <span class="inspect">inspect</span>
        <span class="message-end">more to find more.</span>
      </p>
    </main>

    <!--
      Name: Francis Bhandari
      Also known as Francis the Great. What makes me great exactly? Well, I just am.
      So what should be added in this section is a very tough question. I named it "About me" but what exactly am I? I know not, at least not very clearly. Thus, it certainly would be unfair for my patient reader, curious enough to find this corner of mine, to waste their time reading something that quite definitively is not about me.
      more will be added later should I find more about me. Certainly I must find myself before you get to, aint that just the way?
    -->
  </body>
</html>
